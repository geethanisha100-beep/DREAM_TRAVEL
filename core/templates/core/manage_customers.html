{% extends "core/base.html" %}{% block content %}<h1>Customers</h1>{% include "core/_manage_nav.html" %}
<table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th></tr>{% for u in users %}<tr><td>{{ u.first_name }}</td><td><a href="mailto:{{ u.email }}">{{ u.email }}</a></td><td>{{ u.profile.phone }}</td><td>{{ u.date_joined|date:"d M Y" }}</td></tr>{% empty %}<tr><td colspan="4">No customers yet.</td></tr>{% endfor %}</table>{% endblock %}
