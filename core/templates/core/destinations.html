{% extends "core/base.html" %}{% block content %}<h1>Explore our destinations</h1>
<p><a class="chip" href="{% url 'destinations' %}">All</a>{% for k, l in cats %}<a class="chip" href="?cat={{ k }}">{{ l }}</a>{% endfor %}</p>
<div class="grid">{% for d in places %}<div class="card">{% if d.image %}<img src="{{ d.image.url }}" alt="">{% else %}<div class="ph"></div>{% endif %}<div class="b"><h3>{{ d.name }}</h3><p>{{ d.tagline }}</p><a href="{% url 'packages' %}?q={{ d.name|urlencode }}">See packages</a></div></div>{% empty %}<p>No destinations yet.</p>{% endfor %}</div>{% endblock %}
